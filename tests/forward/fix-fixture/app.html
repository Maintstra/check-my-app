<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Settings fixture</title></head>
<body>
  <main>
    <h1>Business settings</h1>
    <label>Business name <input id="business-name" value="Example Store"></label>
    <button id="save">Save</button>
    <p id="save-result" role="status"></p>
  </main>
  <script>
    document.querySelector('#save').addEventListener('click', () => {
      document.querySelector('#save-result').textContent = 'Saved locally. No external records were changed.';
    });
  </script>
</body>
</html>
